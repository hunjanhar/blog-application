apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: blog-app-argocd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/hunjanhar/blog-application.git'
    targetRevision: prod                                 
    path: k8s/prod-deployment                                 
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: blog-app-ns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true