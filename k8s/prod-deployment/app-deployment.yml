apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-app-deployment
  namespace: blog-app-ns
  labels:
    app: blog-app
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: blog-app
  template:
    metadata:
      labels:
        app: blog-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: blog-app
        image: hunjanhar/blog-app:latest
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        envFrom:
        - secretRef:
            name: blog-app-secrets
        ports:
          - containerPort: 5000
        resources:
          requests:
            cpu: "100m"   
            memory: "256Mi"
          limits:
              cpu: "500m"
              memory: "768Mi"
        volumeMounts:
          - name: tmp-volume
            mountPath: /tmp
          - name: app-persistent-storage
            mountPath: /app/static/uploads

      - name: nginx
        image: nginx:alpine
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        ports:
          - containerPort: 80
        resources:
            requests:
              cpu: "100m"
              memory: "64Mi" 
            limits:
              cpu: "200m"
              memory: "128Mi"
        volumeMounts:
          - name: nginx-config-volume
            mountPath: /etc/nginx/conf.d/default.conf
            subPath: default.conf
          - name: tmp-volume
            mountPath: /tmp
          - name: cache-volume
            mountPath: /var/cache/nginx
          - name: run-volume
            mountPath: /var/run

      - name: nginx-exporter
        image: nginx/nginx-prometheus-exporter:latest
        securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        args:
          - --nginx.scrape-uri=http://127.0.0.1:80/nginx_status
        ports:
          - containerPort: 9113
        resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
      
      volumes:
        - name: nginx-config-volume
          configMap:
            name: nginx-status-config
        - name: app-persistent-storage
          persistentVolumeClaim:
            claimName: app-pvc
        - name: tmp-volume
          emptyDir: {}
        - name: cache-volume
          emptyDir: {}
        - name: run-volume
          emptyDir: {}
