name: Blog App Pipeline

on:
    push:
        branches:
            - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

    test:
        uses: ./.github/workflows/test.yml

    security-scan:
        needs: test
        uses: ./.github/workflows/security.yml
        secrets:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    build:
        needs: [test,security-scan]
        uses: ./.github/workflows/build.yml
        secrets:
            DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
            DOCKERHUB_TOKEN:  ${{ secrets.DOCKERHUB_TOKEN }}
    
    ci-notify:
        needs: [test, security-scan, build]
        if: always()
        uses: ./.github/workflows/ci-notify.yml
        with:
            test_result: ${{ needs.test.result }}
            security_result: ${{ needs.security-scan.result }}
            build_result: ${{ needs.build.result }}
            github_repo: ${{ github.repository }}
            github_repo_id: ${{ github.run_id }}
        secrets:
            MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
            MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
            EMAIL: ${{ secrets.EMAIL }}
    
    deploy:
        needs: build
        uses: ./.github/workflows/deploy.yml
        with:
            image_tag: ${{ needs.build.outputs.image_tag }}
            TARGET_BRANCH: 'prod'
            server_ip: ${{ vars.SERVER_IP }}
        secrets:
            SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
            VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
            REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
            MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
            MYSQL_USER: ${{ secrets.MYSQL_USER }}
            MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
            MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
            AWS_REGION: ${{ secrets.AWS_REGION }}
            AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}
            AWS_BUCKET_URL: ${{ secrets.AWS_BUCKET_URL }}
    
    argocd-sync:
        needs: deploy
        uses: ./.github/workflows/argocd.yml
        with:
            server_ip: ${{ vars.SERVER_IP }}
        secrets:
            SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

    owzapzip-scan:
        needs: argocd-sync
        uses: ./.github/workflows/owzapzip.yml
        with:
            server_ip: ${{ vars.SERVER_IP }}
        
    cd-notify:
        needs: [deploy, argocd-sync, owzapzip-scan]
        if: always()
        uses: ./.github/workflows/cd-notify.yml
        with:
            deploy_result: ${{ needs.deploy.result }}
            argocd_sync_result: ${{ needs.argocd-sync.result }}
            owzap_scan_result: ${{ needs.owzapzip-scan.result }}
            github_repo: ${{ github.repository }}
            github_repo_id: ${{ github.run_id }}
            server_ip: ${{ vars.SERVER_IP }}
        secrets:
            MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
            MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
            EMAIL: ${{ secrets.EMAIL }}