name: Build Workflow

on:
    workflow_call:
        outputs:
            image_tag:
                description: "The generated short SHA tag"
                value: ${{ jobs.app-images.outputs.image_tag }}
        secrets:
            DOCKERHUB_USERNAME:
              required: true
            DOCKERHUB_TOKEN:
              required: true

jobs:
    app-images:
        runs-on: ubuntu-latest
        outputs:
            image_tag: ${{ steps.set-tag.outputs.tag }}
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Generate Dynamic Image Tag
              id: set-tag
              run: echo "tag=v-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

            - name: Build app from Local Image
              uses: docker/build-push-action@v5
              with:
                context: .
                outputs: type=docker,dest=blog-app.tar
                tags:  hunjanhar/blog-app:${{ steps.set-tag.outputs.tag }}
            
            - name: Upload Docker Image Artifacts
              uses: actions/upload-artifact@v4
              with:
                name: docker-tar-images
                path: |
                  blog-app.tar
                retention-days: 1
      
    scan-images:
        runs-on: ubuntu-latest
        needs: app-images
        steps:
            - name: Download Docker Image Artifacts
              uses: actions/download-artifact@v4
              with:
                name: docker-tar-images

            - name: Load blog-app into Docker
              run: docker load -i blog-app.tar

            - name: Trivy Scan blog-app Image
              uses: aquasecurity/trivy-action@master
              with:
                image-ref: hunjanhar/blog-app:${{ needs.app-images.outputs.image_tag }}
                scan-type: 'image'
                severity: 'HIGH,CRITICAL'
                exit-code: '0'

    
    push-images:
        runs-on: ubuntu-latest
        needs: [app-images, scan-images]
        steps:
            - name: Download Docker Image Artifacts
              uses: actions/download-artifact@v4
              with:
                name: docker-tar-images

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Load and Push Pre-Built Images to Docker Hub with Tag Images
              run: |
                docker load -i blog-app.tar
                TAG="${{ needs.app-images.outputs.image_tag }}"
                docker tag hunjanhar/blog-app:$TAG hunjanhar/blog-app:latest
                docker push hunjanhar/blog-app:$TAG
                docker push hunjanhar/blog-app:latest
            
            
            